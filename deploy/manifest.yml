---
# Yak package manifest for the BlenderKit Rhino plugin.
#
# Picked up by `yak build` (run in the deployed plugin folder, where
# this file is copied next to the .rhp). Produces a single
# BlenderKit-<version>-rh8_0-win.yak archive that users can install
# inside Rhino via `_PackageManager` → search "BlenderKit" → Install.
#
# Bump `version` in lockstep with the .rhp's AssemblyVersion (set in
# BlenderKitRhino.csproj <Version>). Yak refuses re-uploads of an
# existing version; bump on every push.
name: BlenderKit
version: 0.1.0
authors:
  - BlenderKit
description: >
  BlenderKit asset browser for Rhino 8 — drag-drop access to thousands
  of free and paid 3D models, materials, and HDR environments. Mirrors
  the Blender BlenderKit add-on: per-asset-type filters, login,
  bookmarks, ratings, and an in-Rhino preview before download.
url: https://www.blenderkit.com
# Keywords surface in the Package Manager search box and on
# yak.rhino3d.com. Keep them lower-case, single-word where possible.
keywords:
  - blenderkit
  - assets
  - materials
  - hdr
  - models
  - library
  - textures
  - asset-browser
# Icon shown in the Package Manager listing — Yak's CLI looks for a
# file at this relative path inside the package directory. The deploy
# script puts our 296×296 logo PNG here as `icon.png`.
icon: icon.png
