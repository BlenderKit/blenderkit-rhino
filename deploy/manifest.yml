---
# Yak package manifest for the Blendkit Rhino plugin (formerly BlenderKit).
#
# Picked up by `yak build` (run in the deployed plugin folder, where
# this file is copied next to the .rhp). Produces a single
# blendkit-<version>-rh8_0-win.yak archive that users install inside
# Rhino via `_PackageManager` -> search "Blendkit" -> Install.
#
# Bump `version` in lockstep with the .rhp's AssemblyVersion (set in
# BlendkitRhino.csproj <Version>). Yak refuses re-uploads of an
# existing version; bump on every push.
#
# RENAME NOTE: this package was renamed from "BlenderKit" to "Blendkit"
# (the company/brand rename). Yak keys packages by `name`, so this is a
# NEW listing on yak.rhino3d.com; the old "BlenderKit" listing stays as
# separate history and cannot be merged. The "formerly BlenderKit" note
# in the description plus the retained `blenderkit` keyword keep the
# package findable for users searching the old name.
name: Blendkit
version: 0.1.6
authors:
  - Blendkit
# Literal block (|) preserves newlines so the alpha warning reads as a
# distinct paragraph in the Package Manager listing instead of getting
# folded into the prose body that follows.
description: |
  Blendkit (formerly BlenderKit).

  EXPERIMENTAL ALPHA - expect bugs, incomplete features, and breaking
  changes between releases. Please report any issues at
  https://github.com/BlenderKit/blendkit-rhino/issues so we can
  track and fix them.

  Blendkit asset browser for Rhino 8 - drag-drop access to thousands
  of free and paid 3D models, materials, and HDR environments. Mirrors
  the Blender add-on: per-asset-type filters, login, bookmarks,
  ratings, and an in-Rhino preview before download.
url: https://github.com/BlenderKit/blendkit-rhino
# Keywords surface in the Package Manager search box and on
# yak.rhino3d.com. Keep them lower-case, single-word where possible.
# `blenderkit` is retained so users searching the old brand still find us.
keywords:
  - blendkit
  - blenderkit
  - assets
  - materials
  - hdr
  - models
  - library
  - textures
  - asset-browser
# Icon shown in the Package Manager listing - Yak's CLI looks for a
# file at this relative path inside the package directory. The deploy
# script puts our 296x296 logo PNG here as `icon.png`.
icon: icon.png
