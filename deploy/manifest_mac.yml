---
# macOS variant of the Yak manifest. Identical to manifest.yml except:
#   * the os: mac directive flags the package as macOS-only so Windows
#     users don't accidentally install a darwin-binary client;
#   * the version stays in lockstep with the Windows package.
#
# Yak builds one .yak per OS - `yak build` in a dir containing this
# file produces blendkit-<version>-rh8_30-mac.yak.
#
# See manifest.yml for the BlenderKit -> Blendkit rename note (new Yak
# listing; old one stays as separate history; `blenderkit` keyword
# retained for discoverability under the old name).
name: Blendkit
version: 0.1.5
authors:
  - Blendkit
description: |
  Blendkit (formerly BlenderKit).

  EXPERIMENTAL ALPHA - expect bugs, incomplete features, and breaking
  changes between releases. Please report any issues at
  https://github.com/BlenderKit/blendkit-rhino/issues so we can
  track and fix them.

  Blendkit asset browser for Rhino 8 (macOS) - drag-drop access to
  thousands of free and paid 3D models, materials, and HDR
  environments. Mirrors the Blender add-on: per-asset-type filters,
  login, bookmarks, ratings, and an in-Rhino preview before download.
url: https://github.com/BlenderKit/blendkit-rhino
keywords:
  - blendkit
  - blenderkit
  - assets
  - materials
  - hdr
  - models
  - library
  - textures
  - asset-browser
icon: icon.png
# macOS-only - the Go client binary shipped in this package is a Mach-O
# executable. The Windows variant (manifest.yml) ships the .exe.
os: mac
