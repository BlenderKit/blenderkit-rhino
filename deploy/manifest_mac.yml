# macOS variant of the Yak manifest. Identical to manifest.yml except:
#   * the os: mac directive flags the package as macOS-only so Windows
#     users don't accidentally install a darwin-binary client;
#   * the version stays in lockstep with the Windows package.
#
# Yak builds one .yak per OS â€” `yak build` in a dir containing this
# file produces blenderkit-<version>-rh8_30-mac.yak.
name: BlenderKit
version: 0.1.2
authors:
  - BlenderKit
description: |
  âš ď¸Ź EXPERIMENTAL ALPHA â€” expect bugs, incomplete features, and
  breaking changes between releases. Please report any issues at
  https://github.com/BlenderKit/blenderkit-rhino/issues so we can
  track and fix them.

  BlenderKit asset browser for Rhino 8 (macOS) â€” drag-drop access to
  thousands of free and paid 3D models, materials, and HDR
  environments. Mirrors the Blender BlenderKit add-on: per-asset-type
  filters, login, bookmarks, ratings, and an in-Rhino preview before
  download.
url: https://github.com/BlenderKit/blenderkit-rhino
keywords:
  - blenderkit
  - assets
  - materials
  - hdr
  - models
  - library
  - textures
  - asset-browser
icon: icon.png
# macOS-only â€” the Go client binary shipped in this package is a Mach-O
